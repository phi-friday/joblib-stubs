project-includes = [
    "src/joblib-stubs",
    "src/tests",
    ".agents/skills/joblib-stub-updater/**/*.py",
]
python-platform = "linux"
python-version = "3.12"
min-severity = "warn"
preset = "strict"
check-unannotated-defs = true
infer-return-types = "checked"
strict-callable-subtyping = true

[errors]
unused-ignore = "error"
unused-type-ignore = "ignore"
deprecated = "warn"
untyped-import = "ignore"
unresolvable-dunder-all = "warn"
variance-mismatch = "warn"
implicit-any-lambda = "ignore"

# stub only
missing-source = "ignore"
missing-override-decorator = "ignore"

[[sub-config]]
matches = "src/tests/**"

[sub-config.errors]
implicit-any = false
